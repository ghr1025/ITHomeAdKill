name: Build & Publish

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MODULE_REPO: Xposed-Modules-Repo/io.github.ghsssss.ithomeadkill

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version-name: ${{ steps.ver.outputs.name }}
      version-code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 为 37.2（AGP 9 minorApiLevel），runner 预装 SDK 通常没有
      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.2" || sdkmanager "platforms;android-37" || true
          sdkmanager "build-tools;37.0.0" || true

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="1.1-dev"
          fi
          CORE="${VERSION_NAME%%-*}"
          IFS='.' read -r MAJ MIN PAT <<< "${CORE}"
          VERSION_CODE=$(( ${MAJ:-0}*10000 + ${MIN:-0}*100 + ${PAT:-0} ))
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "版本: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Build debug APK
        run: >-
          ./gradlew --no-daemon --stacktrace assembleDebug
          -PverName=${{ steps.ver.outputs.name }}
          -PverCode=${{ steps.ver.outputs.code }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/ITHomeAdKill-${{ github.ref_name }}.apk"

      - name: Verify versionCode in APK
        run: |
          APK=$(ls dist/*.apk)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [[ -n "${BT}" && -x "${BT}/aapt2" ]]; then
            BADGING=$("${BT}/aapt2" dump badging "$APK" | head -1)
            echo "$BADGING"
            echo "$BADGING" | grep -q "versionCode='${{ steps.ver.outputs.code }}'" \
              || { echo "versionCode 注入失败，期望 ${{ steps.ver.outputs.code }}"; exit 1; }
          else
            echo "未找到 aapt2，跳过校验"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ITHomeAdKill
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ITHomeAdKill
          path: dist

      - name: Publish to own repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$TAG" dist/*.apk --repo "${GITHUB_REPOSITORY}" \
              --title "$TAG" --notes "CI 构建 ${GITHUB_SHA}" --latest
          fi

      - name: Publish to LSPosed module repo
        run: |
          if gh release view "$TAG" --repo "${MODULE_REPO}" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "${MODULE_REPO}" --clobber
          else
            gh release create "$TAG" dist/*.apk --repo "${MODULE_REPO}" \
              --title "$TAG" --notes "CI 构建 ${GITHUB_SHA}"
          fi

      - name: Update updates.json
        env:
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf modrepo
          git clone --depth 1 "https://github.com/${MODULE_REPO}.git" modrepo
          cd modrepo
          export TAG VERSION_CODE
          export ZIP_URL="https://github.com/${MODULE_REPO}/releases/download/${TAG}/ITHomeAdKill-${TAG}.apk"
          python3 - <<'PY'
          import json, os, pathlib

          p = pathlib.Path("updates.json")
          data = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {"updates": []}
          code = int(os.environ["VERSION_CODE"])
          item = {
              "version": os.environ["TAG"],
              "versionCode": code,
              "zipUrl": os.environ["ZIP_URL"],
              "changelog": f"CI 构建 {os.environ.get('GITHUB_SHA', '')}",
          }
          items = [u for u in data.get("updates", []) if u.get("versionCode") != code]
          items.append(item)
          data["updates"] = sorted(items, key=lambda u: u.get("versionCode", 0))
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          git add updates.json
          if git diff --cached --quiet; then
            echo "updates.json 无变化，跳过提交"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "release ${TAG}"
            git push
          fi
